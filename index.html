<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Kaze Arcade UI</title>
<style>
:root{--bg:#0b141a;--card:#111b21;--el:#182229;--bdr:#222e35;--txt:#e9edef;--mut:#8696a0;--grn:#00a884;--pur:#7c3aed;--red:#f43f5e}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent;user-select:none}
body{background:var(--bg);color:var(--txt);max-width:430px;margin:0 auto;min-height:100vh}
.tabs{display:flex;background:var(--bg);border-bottom:1px solid var(--bdr);position:sticky;top:0;z-index:10}
.tab{flex:1;padding:13px 0;text-align:center;font-size:13px;font-weight:700;color:var(--mut);cursor:pointer;border-bottom:2.5px solid transparent}
.tab.act{color:var(--txt);border-bottom-color:var(--grn)}
.pan{display:none;padding:14px}.pan.act{display:block}
.card{background:var(--card);border:1px solid var(--bdr);border-radius:16px;padding:14px}
.hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.hdr b{font-size:18px}.hdr span{font-size:11px;color:var(--mut);display:block}
.stat{display:flex;gap:6px}
.pill{background:var(--el);border:1px solid var(--bdr);border-radius:10px;padding:4px 9px;text-align:center;min-width:52px}
.pill small{display:block;font-size:9px;color:var(--mut)}.pill b{font-size:13px;font-family:monospace}
.seg{display:flex;gap:6px;background:var(--bg);padding:4px;border-radius:12px;border:1px solid var(--bdr);margin-bottom:10px}
.seg button{flex:1;padding:7px;border:none;border-radius:8px;background:none;color:var(--mut);font-size:12px;font-weight:700;cursor:pointer}
.seg button.act{background:var(--el);color:var(--txt)}
.sbar{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--mut);margin-bottom:10px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--grn);margin-right:6px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:300px;margin:0 auto;position:relative}
.c3{aspect-ratio:1;background:var(--el);border:1px solid var(--bdr);border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:42px;font-weight:600;cursor:pointer;transition:.1s}
.c3:active{transform:scale(.94)}
.c3.X{color:#e9edef}.c3.O{color:var(--grn)}.c3.win{background:#0f2e28;border-color:var(--grn)}
.lvls{display:flex;gap:6px;margin-top:12px}
.lb{flex:1;padding:8px 0;border-radius:99px;border:1px solid var(--bdr);background:none;color:var(--mut);font-size:11px;font-weight:700;cursor:pointer}
.lb.act{background:var(--grn);color:#0b141a;border-color:var(--grn)}
.row{display:flex;gap:8px;margin-top:10px}
.btn{flex:1;padding:11px;border-radius:12px;border:1px solid var(--bdr);background:var(--el);color:var(--txt);font-size:13px;font-weight:700;cursor:pointer}
.btn:active{transform:scale(.96)}
.btn.g{background:var(--grn);color:#0b141a;border-color:var(--grn)}
.g5{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;max-width:320px;margin:0 auto}
.c5{aspect-ratio:1;background:var(--el);border:1px solid var(--bdr);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;cursor:pointer;transition:.12s}
.c5:active{transform:scale(.92)}
.c5.ok{background:#0f2e28;border-color:var(--grn);color:var(--grn)}
.c5.bm{background:#3b121c;border-color:var(--red);color:var(--red)}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;background:var(--bg);padding:8px;border-radius:14px;border:1px solid var(--bdr);max-width:320px;margin:0 auto;touch-action:none}
.c4{aspect-ratio:1;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;background:var(--el);color:var(--txt)}
.v0{background:#151f26;color:transparent}.v2{background:#1f2c34}.v4{background:#243442}.v8{background:#2b4356}.v16{background:#115e59}.v32{background:#00a884;color:#0b141a}.v64{background:#4f46e5}.v128{background:#7c3aed}.v256{background:#9333ea}.v512{background:#db2777}.v1024{background:#e11d48}.v2048{background:#f59e0b;color:#0b141a}
.pad{display:grid;grid-template-columns:repeat(3,52px);gap:6px;justify-content:center;margin-top:12px}
.pb{height:42px;border-radius:10px;border:1px solid var(--bdr);background:var(--el);color:var(--txt);font-size:16px;font-weight:700;cursor:pointer}
.pb:active{background:var(--grn);color:#0b141a}
.msg{text-align:center;font-size:12px;color:var(--grn);font-weight:600;margin-top:10px;min-height:18px}
</style></head><body>

<div class="tabs">
  <div class="tab act" id="t0" onclick="sw(0)">Tic Tac Toe</div>
  <div class="tab" id="t1" onclick="sw(1)">Mines</div>
  <div class="tab" id="t2" onclick="sw(2)">2048</div>
</div>

<div class="pan act" id="p0"><div class="card">
  <div class="hdr"><div><b>Tic-Tac-Toe</b><span>Kaze Morales UI</span></div><div class="stat"><div class="pill"><small>X</small><b id="tx">0</b></div><div class="pill"><small>SERI</small><b id="td">0</b></div><div class="pill"><small>O</small><b id="to">0</b></div></div></div>
  <div class="seg"><button class="act" id="m1" onclick="setMode(1)">Lawan AI</button><button id="m2" onclick="setMode(2)">2 Player</button></div>
  <div class="sbar"><span><i class="dot"></i><b id="tst">Giliranmu (X)</b></span><span id="tlb">Taktisi</span></div>
  <div class="g3" id="g3"></div>
  <div class="lvls" id="lrow">
    <button class="lb" id="l0" onclick="setL(0)">Pemula</button>
    <button class="lb" id="l1" onclick="setL(1)">Terlatih</button>
    <button class="lb act" id="l2" onclick="setL(2)">Taktisi</button>
    <button class="lb" id="l3" onclick="setL(3)">Master</button>
  </div>
  <div class="row"><button class="btn g" onclick="tRst()">Ulang Papan</button></div>
</div></div>

<div class="pan" id="p1"><div class="card">
  <div class="hdr"><div><b>Mines 5×5</b><span>Hindari Ranjau</span></div><div class="stat"><div class="pill"><small>POIN</small><b id="mp">0</b></div><div class="pill"><small>BANK</small><b id="mb">0</b></div></div></div>
  <div class="seg"><button class="act" id="b3" onclick="setB(3)">3 Bom</button><button id="b5" onclick="setB(5)">5 Bom</button><button id="b8" onclick="setB(8)">8 Bom</button></div>
  <div class="g5" id="g5"></div>
  <div class="msg" id="mmsg">Ketuk kotak aman untuk kumpulkan poin</div>
  <div class="row"><button class="btn g" onclick="mCash()">Ambil Poin</button><button class="btn" onclick="mRst()">Main Baru</button></div>
</div></div>

<div class="pan" id="p2"><div class="card">
  <div class="hdr"><div><b>2048</b><span>Geser atau Tombol</span></div><div class="stat"><div class="pill"><small>SKOR</small><b id="s2">0</b></div><div class="pill"><small>BEST</small><b id="b2">0</b></div></div></div>
  <div class="g4" id="g4"></div>
  <div class="pad"><div></div><button class="pb" onclick="mv('U')">▲</button><div></div><button class="pb" onclick="mv('L')">◀</button><button class="pb" onclick="mv('D')">▼</button><button class="pb" onclick="mv('R')">▶</button></div>
  <div class="row"><button class="btn" onclick="r2048()">Mulai Ulang 2048</button></div>
</div></div>

<script>
function sw(i){[0,1,2].forEach(n=>{document.getElementById('t'+n).classList.toggle('act',n===i);document.getElementById('p'+n).classList.toggle('act',n===i);});}
// 1. TIC-TAC-TOE
let tb=Array(9).fill(''),md=1,lv=2,wx=0,wd=0,wo=0,trn='X',lk=false,wl=null;
const W=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]],chk=(b,p)=>W.find(w=>w.every(i=>b[i]===p));
function tDr(){const g=document.getElementById('g3');g.innerHTML='';tb.forEach((v,i)=>{const d=document.createElement('div');d.className='c3 '+v+(wl&&wl.includes(i)?' win':'');d.innerText=v==='X'?'✕':v==='O'?'◯':'';d.onclick=()=>tTap(i);g.appendChild(d);});}
function setMode(m){md=m;document.getElementById('m1').classList.toggle('act',m===1);document.getElementById('m2').classList.toggle('act',m===2);document.getElementById('lrow').style.display=m===1?'flex':'none';document.getElementById('tlb').innerText=m===1?['Pemula','Terlatih','Taktisi','Master'][lv]:'2 Player';tRst();}
function setL(l){lv=l;[0,1,2,3].forEach(n=>document.getElementById('l'+n).classList.toggle('act',n===l));document.getElementById('tlb').innerText=['Pemula','Terlatih','Taktisi','Master'][l];tRst();}
function mm(b,mx){if(chk(b,'O'))return 10;if(chk(b,'X'))return -10;if(!b.includes(''))return 0;let bs=mx?-99:99;for(let i=0;i<9;i++)if(!b[i]){b[i]=mx?'O':'X';let v=mm(b,!mx);b[i]='';bs=mx?Math.max(bs,v):Math.min(bs,v);}return bs;}
function tTap(i){
  if(lk||tb[i])return;tb[i]=trn;let w=chk(tb,trn);
  if(w){lk=true;wl=w;if(trn==='X'){wx++;document.getElementById('tx').innerText=wx;}else{wo++;document.getElementById('to').innerText=wo;}document.getElementById('tst').innerText=md===1?'Kamu Menang!':'Player '+trn+' Menang!';return tDr();}
  let av=tb.map((v,k)=>v===''?k:-1).filter(k=>k>=0);
  if(!av.length){lk=true;wd++;document.getElementById('td').innerText=wd;document.getElementById('tst').innerText='Seri!';return tDr();}
  if(md===2){trn=trn==='X'?'O':'X';document.getElementById('tst').innerText='Giliran '+trn;return tDr();}
  tDr();lk=true;document.getElementById('tst').innerText='AI berpikir...';
  setTimeout(()=>{let m=-1;
    if(lv===3){let bs=-99;for(let x of av){tb[x]='O';let v=mm(tb,false);tb[x]='';if(v>bs){bs=v;m=x;}}}
    else{if(lv>=1)for(let x of av){tb[x]='O';if(chk(tb,'O'))m=x;tb[x]='';}if(m<0&&lv>=2)for(let x of av){tb[x]='X';if(chk(tb,'X'))m=x;tb[x]='';}if(m<0)m=(av.includes(4)&&lv>=1)?4:av[Math.floor(Math.random()*av.length)];}
    tb[m]='O';let aw=chk(tb,'O');
    if(aw){wl=aw;wo++;document.getElementById('to').innerText=wo;document.getElementById('tst').innerText='AI Menang!';return tDr();}
    if(!tb.includes('')){wd++;document.getElementById('td').innerText=wd;document.getElementById('tst').innerText='Seri!';return tDr();}
    lk=false;document.getElementById('tst').innerText='Giliranmu (X)';tDr();
  },220);
}
function tRst(){tb.fill('');trn='X';lk=false;wl=null;document.getElementById('tst').innerText=md===1?'Giliranmu (X)':'Giliran X';tDr();}
tDr();

// 2. MINES 5x5
let mCnt=3,mB=[],mOp=new Set(),mOver=false,mPts=0,mBank=Number(localStorage.getItem('kz_mb')||0);
function setB(n){mCnt=n;[3,5,8].forEach(x=>document.getElementById('b'+x).classList.toggle('act',x===n));mRst();}
function mRst(){mB=[];while(mB.length<mCnt){let r=Math.floor(Math.random()*25);if(!mB.includes(r))mB.push(r);}mOp.clear();mOver=false;mPts=0;document.getElementById('mmsg').innerText='Ketuk kotak aman untuk kumpulkan poin';mDr();}
function mTap(i){
  if(mOver||mOp.has(i))return;mOp.add(i);
  if(mB.includes(i)){mOver=true;mPts=0;document.getElementById('mmsg').innerText='💥 Kena ranjau! Poin ronde ini hangus.';}
  else{mPts+=mCnt*25;document.getElementById('mmsg').innerText='💎 Aman! +'+mCnt*25+' Poin (Tekan Ambil Poin untuk simpan)';}
  mDr();
}
function mCash(){if(mPts<=0||mOver)return;mBank+=mPts;localStorage.setItem('kz_mb',mBank);document.getElementById('mmsg').innerText='✅ Disimpan +'+mPts+' Poin ke Bank!';mPts=0;mOver=true;mDr();}
function mDr(){
  document.getElementById('mp').innerText=mPts;document.getElementById('mb').innerText=mBank;
  const g=document.getElementById('g5');g.innerHTML='';
  for(let i=0;i<25;i++){
    const d=document.createElement('div'),isB=mB.includes(i),op=mOp.has(i);
    d.className='c5'+(op?(isB?' bm':' ok'):(mOver&&isB?' bm':''));
    d.innerText=(op||mOver)?(isB?'💣':(op?'💎':'')):'';
    d.onclick=()=>mTap(i);g.appendChild(d);
  }
}
mRst();

// 3. 2048
let bd=[],sc2=0,bs2=Number(localStorage.getItem('kz_2048')||0);
function add2(){let em=[];bd.forEach((v,i)=>{if(!v)em.push(i);});if(em.length)bd[em[Math.floor(Math.random()*em.length)]]=Math.random()<.9?2:4;}
function r2048(){bd=Array(16).fill(0);sc2=0;add2();add2();d2048();}
function sl(r){let a=r.filter(x=>x);for(let i=0;i<a.length-1;i++)if(a[i]===a[i+1]){a[i]*=2;sc2+=a[i];a[i+1]=0;}a=a.filter(x=>x);while(a.length<4)a.push(0);return a;}
function mv(dir){
  let old=bd.join(',');
  for(let i=0;i<4;i++){
    let idx=dir==='L'?[i*4,i*4+1,i*4+2,i*4+3]:dir==='R'?[i*4+3,i*4+2,i*4+1,i*4]:dir==='U'?[i,i+4,i+8,i+12]:[i+12,i+8,i+4,i];
    let res=sl(idx.map(k=>bd[k]));idx.forEach((k,j)=>bd[k]=res[j]);
  }
  if(bd.join(',')!==old){if(sc2>bs2){bs2=sc2;localStorage.setItem('kz_2048',bs2);}add2();d2048();}
}
function d2048(){
  document.getElementById('s2').innerText=sc2;document.getElementById('b2').innerText=bs2;
  document.getElementById('g4').innerHTML=bd.map(v=>`<div class="c4 v${v>2048?2048:v}">${v||''}</div>`).join('');
}
let sx=0,sy=0,g4=document.getElementById('g4');
g4.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;},{passive:true});
g4.addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))>24)mv(Math.abs(dx)>Math.abs(dy)?(dx>0?'R':'L'):(dy>0?'D':'U'));});
r2048();

const qt=new URLSearchParams(location.search).get('tab');
if(qt==='mines')sw(1);else if(qt==='2048')sw(2);else sw(0);
</script></body></html>
