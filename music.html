<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Kaze Music Lyrics</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;overflow:hidden;background:#120d08;color:#fff}
.bg{position:fixed;inset:-40px;background-size:cover;background-position:center;filter:blur(52px) saturate(1.45) brightness(.58);transform:scale(1.18);transition:background-image .6s ease;z-index:0}
.scrim{position:fixed;inset:0;background:radial-gradient(circle at 22% 40%,rgba(255,255,255,.06),rgba(0,0,0,.42));z-index:1}
.topbar{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;gap:8px;padding:10px 14px;background:linear-gradient(180deg,rgba(0,0,0,.45),transparent)}
.topbar input{flex:1;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(12px);border-radius:99px;padding:7px 14px;color:#fff;font-size:12px;outline:none}
.topbar input::placeholder{color:rgba(255,255,255,.65)}
.topbar button{background:rgba(255,255,255,.2);border:none;border-radius:99px;padding:7px 14px;color:#fff;font-weight:700;font-size:12px;cursor:pointer;backdrop-filter:blur(10px)}
.wrap{position:relative;z-index:5;height:100%;display:grid;grid-template-columns:minmax(220px,41%) 1fr;gap:22px;padding:54px 26px 20px;align-items:center}
@media(max-width:640px){.wrap{grid-template-columns:1fr;grid-template-rows:auto 1fr;gap:12px;padding:52px 18px 16px;align-items:stretch}}
.left{display:flex;flex-direction:column;justify-content:center;max-width:340px;width:100%;margin:0 auto}
.cov-box{width:100%;aspect-ratio:1/1;max-width:270px;margin:0 auto 14px;border-radius:16px;overflow:hidden;box-shadow:0 22px 46px rgba(0,0,0,.55);background:rgba(255,255,255,.08)}
@media(max-width:640px){.left{max-width:100%}.top-row{display:flex;align-items:center;gap:12px;margin-bottom:10px}.cov-box{width:76px;max-width:76px;margin:0;border-radius:12px;flex-shrink:0}}
.cov-box img{width:100%;height:100%;object-fit:cover;display:block}
.meta{display:flex;justify-content:space-between;align-items:center;gap:8px;flex:1;min-width:0}
.meta-txt{min-width:0}
.title{font-size:16px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.2px}
.artist{font-size:13px;color:rgba(255,255,255,.68);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.ic-grp{display:flex;gap:6px;flex-shrink:0}
.ic{width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;font-size:12px;color:rgba(255,255,255,.9)}
.prog{margin-top:12px}
.bar-in{width:100%;-webkit-appearance:none;appearance:none;height:4px;border-radius:99px;background:rgba(255,255,255,.25);outline:none;cursor:pointer}
.bar-in::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:10px;border-radius:50%;background:#fff;box-shadow:0 0 8px rgba(255,255,255,.8)}
.times{display:flex;justify-content:space-between;font-size:10px;color:rgba(255,255,255,.62);margin-top:4px;font-variant-numeric:tabular-nums}
.ctrls{display:flex;justify-content:center;align-items:center;gap:30px;margin:14px 0 12px}
.cb{background:none;border:none;color:#fff;font-size:24px;cursor:pointer;opacity:.92;transition:transform .1s}
.cb:active{transform:scale(.86)}
.cb.play{font-size:32px}
.vol{display:flex;align-items:center;gap:8px;opacity:.75;font-size:12px}
.vol input{flex:1}
.right{height:100%;overflow-y:auto;padding:24% 8px 40%;scroll-behavior:smooth;mask-image:linear-gradient(180deg,transparent 0%,#000 18%,#000 82%,transparent 100%);-webkit-mask-image:linear-gradient(180deg,transparent 0%,#000 18%,#000 82%,transparent 100%)}
.right::-webkit-scrollbar{display:none}
.line{font-size:clamp(22px,3.6vw,34px);font-weight:800;line-height:1.28;letter-spacing:-.5px;margin-bottom:20px;color:rgba(255,255,255,.32);filter:blur(1.5px);transform:scale(.96);transform-origin:left center;transition:all .42s cubic-bezier(.22,1,.36,1);cursor:pointer}
.line.past{color:rgba(255,255,255,.22);filter:blur(2px)}
.line.act{color:rgba(255,255,255,.45);filter:blur(0);transform:scale(1);text-shadow:0 4px 24px rgba(255,255,255,.18)}
.line.act .w{display:inline-block;transition:color .2s ease,text-shadow .2s ease}
.line.act .w.lit{color:#fff;text-shadow:0 0 18px rgba(255,255,255,.45)}
.brand{position:fixed;bottom:8px;right:14px;z-index:10;font-size:10px;font-weight:700;color:rgba(255,255,255,.42);letter-spacing:.6px}
</style></head><body>
<div class="bg" id="bg"></div><div class="scrim"></div>
<div class="topbar">
  <input id="qIn" placeholder="Cari lagu + artis (misal: See You Again Tyler)..." />
  <button onclick="goSearch()">Cari</button>
</div>
<div class="wrap">
  <div class="left">
    <div class="top-row">
      <div class="cov-box"><img id="cov" src="" alt="" /></div>
      <div class="meta">
        <div class="meta-txt"><div class="title" id="tTitle">Memuat...</div><div class="artist" id="tArtist">Kaze MoralesBot</div></div>
        <div class="ic-grp"><div class="ic">☆</div><div class="ic">•••</div></div>
      </div>
    </div>
    <div class="prog">
      <input type="range" class="bar-in" id="seek" min="0" max="100" value="0" />
      <div class="times"><span id="tCur">0:00</span><span id="tRem">-0:30</span></div>
    </div>
    <div class="ctrls">
      <button class="cb" onclick="prev()">⏮</button>
      <button class="cb play" id="pBtn" onclick="togglePlay()">▶</button>
      <button class="cb" onclick="next()">⏭</button>
    </div>
    <div class="vol"><span>🔈</span><input type="range" class="bar-in" id="vol" min="0" max="1" step="0.02" value="0.85" /><span>🔊</span></div>
  </div>
  <div class="right" id="lyrBox"><div class="line act"><span class="w lit">Memuat lirik sinkron...</span></div></div>
</div>
<div class="brand">KAZE MORALESBOT</div>
<audio id="aud" playsinline></audio>

<script>
const aud = document.getElementById('aud'), lyrBox = document.getElementById('lyrBox');
let tracks = [], idx = 0, lyrics = [], actIdx = -1;
const fmt = s => { s = Math.max(0, Math.floor(s || 0)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };

function parseLrc(lrc) {
  const out = [];
  for (const raw of String(lrc || '').split('\n')) {
    const m = raw.match(/\[(\d+):(\d+(?:\.\d+)?)\](.*)/);
    if (m) {
      const t = parseInt(m[1], 10) * 60 + parseFloat(m[2]);
      const text = m[3].trim();
      if (text) out.push({ t, text });
    }
  }
  return out;
}

function renderLyrics() {
  if (!lyrics.length) {
    lyrBox.innerHTML = '<div class="line act"><span class="w lit">♪ Instrumental / Lirik belum tersedia ♪</span></div>';
    return;
  }
  lyrBox.innerHTML = lyrics.map((l, i) => {
    const ws = l.text.split(/\s+/).map((w, wi) => `<span class="w" data-wi="${wi}">${w}&nbsp;</span>`).join('');
    return `<div class="line" id="ln_${i}" onclick="jumpTo(${l.t})">${ws}</div>`;
  }).join('');
  actIdx = -1;
  syncLyric(0);
}

function jumpTo(t) {
  if (aud.duration) { aud.currentTime = Math.min(t, Math.max(0, aud.duration - 0.5)); aud.play().catch(() => {}); }
}

function syncLyric(now) {
  if (!lyrics.length) return;
  let cur = 0;
  for (let i = 0; i < lyrics.length; i++) { if (now >= lyrics[i].t) cur = i; else break; }
  if (cur !== actIdx) {
    actIdx = cur;
    document.querySelectorAll('.line').forEach((el, i) => {
      el.classList.toggle('act', i === cur);
      el.classList.toggle('past', i < cur);
    });
    const el = document.getElementById('ln_' + cur);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
  const activeEl = document.getElementById('ln_' + cur);
  if (activeEl) {
    const t0 = lyrics[cur].t, t1 = lyrics[cur + 1] ? lyrics[cur + 1].t : (t0 + 4);
    const pct = Math.max(0, Math.min(1, (now - t0) / Math.max(0.5, t1 - t0)));
    const words = activeEl.querySelectorAll('.w');
    const litCount = Math.ceil(pct * words.length);
    words.forEach((w, wi) => w.classList.toggle('lit', wi < litCount));
  }
}

async function fetchLyrics(title, artist) {
  lyrBox.innerHTML = '<div class="line act"><span class="w lit">Mencari lirik sinkron...</span></div>';
  try {
    const r = await fetch(`https://lrclib.net/api/search?q=${encodeURIComponent(title + ' ' + artist)}`);
    const arr = await r.json();
    const hit = Array.isArray(arr) ? (arr.find(x => x.syncedLyrics) || arr.find(x => x.plainLyrics)) : null;
    if (hit?.syncedLyrics) { lyrics = parseLrc(hit.syncedLyrics); renderLyrics(); return; }
    if (hit?.plainLyrics) {
      const ls = hit.plainLyrics.split('\n').map(x => x.trim()).filter(Boolean);
      lyrics = ls.map((text, i) => ({ t: i * 3.5, text }));
      renderLyrics(); return;
    }
  } catch {}
  lyrics = []; renderLyrics();
}

function loadTrack(i, auto = false) {
  if (!tracks[i]) return;
  idx = i; const tr = tracks[i];
  document.getElementById('tTitle').innerText = tr.t;
  document.getElementById('tArtist').innerText = tr.a;
  const img = tr.cov || '';
  document.getElementById('cov').src = img;
  document.getElementById('bg').style.backgroundImage = img ? `url("${img}")` : 'none';
  aud.src = tr.p || '';
  fetchLyrics(tr.t, tr.a);
  if (auto && tr.p) aud.play().catch(() => {});
}

function togglePlay() { if (!aud.src) return; aud.paused ? aud.play().catch(() => {}) : aud.pause(); }
function next() { if (tracks.length) loadTrack((idx + 1) % tracks.length, true); }
function prev() { if (tracks.length) loadTrack((idx - 1 + tracks.length) % tracks.length, true); }

aud.addEventListener('play', () => document.getElementById('pBtn').innerText = '⏸');
aud.addEventListener('pause', () => document.getElementById('pBtn').innerText = '▶');
aud.addEventListener('timeupdate', () => {
  if (aud.duration) {
    document.getElementById('seek').value = (aud.currentTime / aud.duration) * 100;
    document.getElementById('tCur').innerText = fmt(aud.currentTime);
    document.getElementById('tRem').innerText = '-' + fmt(aud.duration - aud.currentTime);
    syncLyric(aud.currentTime);
  }
});
document.getElementById('seek').addEventListener('input', e => { if (aud.duration) aud.currentTime = (e.target.value / 100) * aud.duration; });
document.getElementById('vol').addEventListener('input', e => aud.volume = parseFloat(e.target.value));

async function searchMusic(q) {
  document.getElementById('tTitle').innerText = 'Mencari...';
  try {
    const r = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(q)}&media=music&entity=song&limit=5`);
    const j = await r.json();
    if (j.results?.length) {
      tracks = j.results.map(x => ({
        t: x.trackName || q, a: x.artistName || 'Artis',
        cov: (x.artworkUrl100 || '').replace('100x100bb', '600x600bb'),
        p: x.previewUrl || ''
      }));
      loadTrack(0, false); return;
    }
  } catch {}
  document.getElementById('tTitle').innerText = q;
}
function goSearch() { const v = document.getElementById('qIn').value.trim(); if (v) searchMusic(v); }
document.getElementById('qIn').addEventListener('keydown', e => { if (e.key === 'Enter') goSearch(); });
const qParam = new URLSearchParams(location.search).get('q') || 'See You Again Tyler The Creator';
document.getElementById('qIn').value = qParam;
searchMusic(qParam);
</script></body></html>
